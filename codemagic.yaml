workflows:
  ios-release:
    name: iOS Release Build
    environment:
      flutter: stable
      xcode: latest
      vars:
        XCODE_WORKSPACE: Runner.xcworkspace
        XCODE_SCHEME: Runner
        # Set API_BASE_URL in the Codemagic UI (HTTPS backend). Do not commit secrets.
    scripts:
      - name: Install dependencies
        script: flutter pub get
      - name: Validate API_BASE_URL
        script: |
          if [ -z "${API_BASE_URL:-}" ]; then
            echo "API_BASE_URL must be set in Codemagic environment variables"
            exit 1
          fi
          case "$API_BASE_URL" in
            https://*) ;;
            *)
              echo "API_BASE_URL must be an https:// URL"
              exit 1
              ;;
          esac
      - name: Build iOS
        script: flutter build ios --release --dart-define=API_BASE_URL="$API_BASE_URL"
    artifacts:
      - build/ios/ipa/*.ipa
